# kx2-local configuration (laptop with the KX2 and Win-Test).
# Copy to config/local.yaml and adjust. Missing keys use the built-in defaults.

remote:
  host: 192.168.178.50          # shack PC; leave empty for local-only mode
  port: 7355

kx2:
  port: /dev/ttyUSB0
  baud: 38400
  k31: true                     # extended mode: NR/notch/CWT become visible

wintest:
  cat_pty_link: /tmp/anyrig-com1      # link ~/.wine/dosdevices/com1 to this
  winkeyer_pty_link: /tmp/anyrig-com2 # link ~/.wine/dosdevices/com2 to this (milestone M4)
  cq_repeat_s: null          # Win-Test CQ repeat interval [s], e.g. 3.0 – keeps the first pause right
  traffic_log: anyrig-wintest.log     # every frame from/to Win-Test; empty = off

router:
  # where Win-Test commands go that the K3 emulation does not handle itself:
  #   remote = to the home rig (normal remote operation, TS-590SG Lua scripts)
  #   kx2    = to the KX2 (local-only mode, behaves like a directly connected KX2)
  default: remote
  ignore: [KS]                  # keyer speed belongs to the WinKeyer emulation
  to_both: [RC]                 # clear RIT on both rigs
  translate: {}                 # e.g. {"SWT34;": "CA1;"}
  block: [TX, RX, PS0, SR, KY]
  prefix_remote: "@"

# KX2 functions without a direct counterpart on the home rig (TS-590SG values shown).
# key: rig function, on/off: values to set; modes: only when the KX2 is in one of these modes.
# Remove an entry to leave the KX2 key unused. A plain action name (e.g. beat_cancel_toggle) also works.
kx2_keys:
  apf:   {key: notch, on: 2, off: 0, modes: [CW, CW-R]}   # APF (CW)  -> manual notch
  notch: {key: notch, on: 1, off: 0, modes: [USB, LSB]}   # NTCH (SSB) -> auto notch

# RX audio from the shack. jitter_ms 40 for WLAN, 25 with a cable. sink: pulse (low latency),
# auto, alsa:<device>. KX2 AF knob 0..60 = volume (af_curve log: 60 = 1.0, af_range_db below).
audio: {enabled: true, port: 7356, jitter_ms: 40, sink: pulse, af_curve: log, af_range_db: 40, gain: 1.0}
webui: {host: 127.0.0.1, port: 8073}
log: {level: INFO, file: null}
