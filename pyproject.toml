[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kx2-to-anyrig"
dynamic = ["version"]
description = "Use an Elecraft KX2 as local control head for a remote transceiver (remote contesting with Win-Test)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "DK5TX"}]
requires-python = ">=3.10"
dependencies = ["PyYAML"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
kx2-local = "anyrig.local.main:main"
anyrig-remote = "anyrig.remote.main:main"

[tool.setuptools.dynamic]
version = {attr = "anyrig.__version__"}

[tool.setuptools.packages.find]
include = ["anyrig*"]

[tool.setuptools.package-data]
anyrig = ["local/webui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
